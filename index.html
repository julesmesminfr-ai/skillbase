/* =====================================================================
   ROUTEUR
   ===================================================================== */
let state = {}, current = '', history_ = [];
function parse() { const h = location.hash.replace(/^#\/?/, ''); const [name, ...params] = h.split('/'); return {h, name:name || 'home', params:params.map(decodeURIComponent)}; }
function route() {
  const {h, name, params} = parse();
  if (h !== current) { if (current) history_.push(current); state = {}; current = h; window.scrollTo(0, 0); closeSheet(); }
  render(name, params);
}
function render(name, params) {
  if (!db || !db.onboarded) name = 'welcome';
  const out = (screens[name] || screens.home)(params, state);
  $('#view').innerHTML = out.html;
  const tb = $('#tabbar'); tb.style.display = out.tab ? 'flex' : 'none'; if (out.tab) tb.innerHTML = tabbar(out.tab);
  bind(); hydrate();
}
function rerender() { const {name, params} = parse(); render(name, params); }
function go(h) { if (location.hash === h) rerender(); else location.hash = h; }
function goBack(fallback = '#/') { const prev = history_.pop(); current = ''; location.hash = prev ? '#/' + prev : fallback; }

/* Champs : on garde les valeurs en mémoire sans tout redessiner */
function bind() {
  const live = $('[data-live]');
  if (live) live.addEventListener('input', e => {
    state[live.dataset.live] = e.target.value; const pos = e.target.selectionStart; rerender();
    const el = $('[data-live]'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} }
  });
  $$('[data-keep]').forEach(el => el.addEventListener('input', e => { (state.form || state)[el.dataset.keep] = e.target.value; }));
  const url = $('#f-url');
  if (url) url.addEventListener('change', () => onUrl(url.value.trim()));
  const fsk = $('#f-skill'); if (fsk) fsk.addEventListener('change', e => { state.form.skill = e.target.value; state.form.level = ''; rerender(); });
  const lsk = $('#l-skill'); if (lsk) lsk.addEventListener('change', e => { state.form.skill = e.target.value; state.form.res = ''; rerender(); });
  const lres = $('#l-res'); if (lres) lres.addEventListener('change', e => state.form.res = e.target.value);
  const lmin = $('#l-minutes'); if (lmin) lmin.addEventListener('input', e => { const v = parseInt(e.target.value, 10); if (v > 0) { state.form.minutes = Math.min(v, 1440); $$('[data-act="l-min"]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === state.form.minutes)); $('[data-act="log-save"]').textContent = 'Enregistrer ' + fmtDur(state.form.minutes); } });
  const ld = $('#l-date'); if (ld) ld.addEventListener('change', e => state.form.date = e.target.value || todayKey());
  const wn = $('#w-name'); if (wn) { wn.addEventListener('input', e => state.name = e.target.value); wn.addEventListener('keydown', e => { if (e.key === 'Enter') $('[data-act="w-start"]').click(); }); }
  const ns = $('#new-skill-name'); if (ns) ns.addEventListener('keydown', e => { if (e.key === 'Enter') $('[data-act="create-skill"]').click(); });
  const prog = $('#prog');
  if (prog) {
    prog.addEventListener('input', e => $('#prog-val').textContent = e.target.value + ' %');
    prog.addEventListener('change', e => { const m = mine(prog.dataset.id); m.progress = +e.target.value; m.touchedAt = Date.now(); save(); if (m.progress === 100) toast('Bravo ! Tu peux passer au niveau suivant'); });
  }
  const notes = $('#res-notes');
  if (notes) notes.addEventListener('input', e => { const r = res(notes.dataset.id); r.notes = e.target.value; clearTimeout(bind.t); bind.t = setTimeout(save, 400); });
  const sr = $('#score-range');
  if (sr) sr.addEventListener('input', e => {
    const s = state.score = +e.target.value;
    $('#big-score').textContent = s; $('#big-score').style.color = scoreColor(s);
    $('#score-label').textContent = scoreLabel(s); $('#score-label').style.background = scoreColor(s);
    $('#rate-btn').textContent = 'Enregistrer ma note · ' + s;
    if (!state.crit) $$('.crit-range').forEach((el, i) => { el.value = s; $('#crit-' + i).textContent = s; });
  });
  $$('.crit-range').forEach(el => el.addEventListener('input', e => {
    if (!state.crit) state.crit = [state.score, state.score, state.score, state.score];
    state.crit[+el.dataset.i] = +e.target.value; $('#crit-' + el.dataset.i).textContent = e.target.value;
  }));
  const rtx = $('#rate-text'); if (rtx) rtx.addEventListener('input', e => state.text = e.target.value);
  const sn = $('#s-name'); if (sn) sn.addEventListener('change', e => { const v = e.target.value.trim(); if (v) { db.profile.name = v; save(); toast('Prénom mis à jour'); } });
  const imp = $('#import-file'); if (imp) imp.addEventListener('change', e => importFile(e.target.files[0]));
  const ak = $('#s-aikey'); if (ak) ak.addEventListener('change', e => { db.settings.aiKey = e.target.value.trim(); save(); toast(db.settings.aiKey ? 'Clé enregistrée' : 'Clé retirée'); rerender(); });
  const pd = $('#pf-date'); if (pd) pd.addEventListener('change', e => state.form.date = e.target.value || todayKey());
  const pt = $('#pf-title'); if (pt) pt.addEventListener('change', () => rerender());
  const sa = $('#sc-app'); if (sa) sa.addEventListener('keydown', e => { if (e.key === 'Enter') $('#sc-min').focus(); });
  const sm = $('#sc-min'); if (sm) sm.addEventListener('keydown', e => { if (e.key === 'Enter') $('[data-act="sc-add"]').click(); });
}

/* Fichiers (photos, son) et listes déroulantes dynamiques */
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.matches('[data-sc-skill]')) { const x = db.screen.find(y => y.id === t.dataset.scSkill); if (x) { x.skill = t.value; save(); } return; }
  if (!t.matches('input[type=file][data-file]') || !t.files.length) return;
  const kind = t.dataset.file, files = [...t.files];
  try {
    if (kind === 'avatar') { db.profile.avatar = await squareDataURL(files[0]); save(); toast('Photo de profil mise à jour'); rerender(); }
    if (kind === 'proof') { const {blob} = await compressImage(files[0], 1200); state.form.img = await saveMedia(blob); rerender(); }
    if (kind === 'mood') {
      toast(files.length > 1 ? `Ajout de ${files.length} photos…` : 'Ajout de la photo…');
      for (const f of files) { const {blob, w, h} = await compressImage(f, 1400); db.mood.items.push({id:uid('i'), kind:'photo', media:await saveMedia(blob), w, h, caption:'', createdAt:Date.now()}); }
      save(); toast('Moodboard mis à jour'); rerender();
    }
    if (kind === 'music') {
      const f = files[0]; if (f.size > 25 * 1024 * 1024) { toast('Fichier trop lourd (25 Mo maximum)'); return; }
      if (db.mood.music && db.mood.music.media) dropMedia(db.mood.music.media);
      db.mood.music = {kind:'file', media:await saveMedia(f), title:f.name.replace(/\.[^.]+$/, '')}; save(); closeSheet(); toast('Son ajouté'); rerender();
    }
  } catch (err) { toast('Impossible de lire ce fichier'); }
});

async function onUrl(u) {
  const f = state.form; f.url = u;
  const d = detect(u);
  if (d) { f.type = d.type; f.source = d.source; }
  if (u && !f.title.trim() && /^https?:\/\//.test(u)) {
    try {
      const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 5000);
      const r = await fetch('https://noembed.com/embed?url=' + encodeURIComponent(u), {signal:ctrl.signal});
      const j = await r.json();
      if (j && j.title && state.form === f && !f.title.trim()) { f.title = j.title; if (j.author_name && f.type === 'video') f.source = (f.source ? f.source + ' · ' : '') + j.author_name; }
    } catch (e) { /* pas grave : on remplit à la main */ }
  }
  if (state.form !== f) return;
  rerender();
  if (u && /^https?:\/\//.test(u) && (db.settings.aiKey || '').trim() && !(f.summary || '').trim()) actions['ai-run']();
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset, act = d.act;
  if (act === 'close-sheet') { if (e.target === el) closeSheet(); return; }
  const A = actions[act]; if (A) { e.preventDefault(); A(d, el); }
});

const actions = {
  /* Bienvenue */
  'w-goal': d => { state.goal = +d.v; rerender(); },
  'w-start': () => {
    const name = (state.name || '').trim();
    if (!name) { toast('Indique ton prénom pour commencer'); $('#w-name').focus(); return; }
    db = freshDb(name, state.goal); save(); state = {}; rerender();
  },
  'w-pick': d => { state.picked.has(d.id) ? state.picked.delete(d.id) : state.picked.add(d.id); rerender(); },
  'w-finish': d => {
    if (!d.skip) state.picked.forEach(id => addSkill(id, 'learning'));
    db.onboarded = true; save(); state = {}; current = ''; location.hash = '#/'; rerender();
    toast(d.skip ? 'Bienvenue !' : 'C’est parti ! Ajoute ta première ressource');
  },

  /* Ajout rapide (bouton +) */
  quick: () => openSheet(`
    <button class="opt" data-act="add-res">${ic('plus', 22, 2)}Ajouter une ressource</button>
    <a href="#/log">${ic('clock', 22, 2)}Enregistrer une session</a>
    <a href="#/explore">${ic('explore', 22, 2)}Ajouter une compétence</a>`),
  'add-res': d => { closeSheet(); go('#/add' + (d.skill ? '/' + d.skill : '')); },
  'go-back': () => goBack(),

  /* Compétences */
  'quick-add-skill': d => { addSkill(d.id); save(); toast(`${skill(d.id).name} ajoutée à tes compétences`); rerender(); },
  'skill-status': d => {
    const m = mine(d.id);
    if (m && m.status === d.v) return;
    addSkill(d.id, d.v); if (d.v === 'known') { mine(d.id).progress = 100; }
    save(); toast({learning:'Ajoutée à « J’apprends »', known:'Ajoutée à « Je maîtrise »', wish:'Ajoutée à « Plus tard »'}[d.v]); rerender();
  },
  level: d => { const m = mine(d.id); m.level = +d.i; m.progress = 0; m.touchedAt = Date.now(); save(); rerender(); },
  'skill-menu': d => {
    const s = skill(d.id), m = mine(d.id), custom = db.customSkills.some(x => x.id === d.id);
    openSheet(`<div style="padding:4px 12px 8px"><span class="title">${esc(s.name)}</span></div>
      ${custom ? `<button class="opt" data-act="rename-skill" data-id="${d.id}">${ic('edit', 22)}Renommer</button>` : ''}
      ${m ? `<button class="opt" data-act="remove-skill" data-id="${d.id}">${ic('close', 22, 2)}Retirer de mes compétences</button>` : ''}
      ${custom ? `<button class="opt" data-act="delete-skill" data-id="${d.id}" style="color:var(--bad)">${ic('trash', 22)}Supprimer la compétence et ses ressources</button>` : ''}
      ${!m && !custom ? '<span class="sub" style="padding:8px 12px">Choisis un statut (J’apprends, Je maîtrise ou Plus tard) pour l’ajouter à ton profil.</span>' : ''}`);
  },
  'remove-skill': d => { delete db.mine[d.id]; save(); closeSheet(); toast('Retirée de tes compétences (tes ressources sont conservées)'); rerender(); },
  'rename-skill': d => {
    const s = db.customSkills.find(x => x.id === d.id); closeSheet();
    const v = prompt('Nouveau nom', s.name); if (v && v.trim()) { s.name = v.trim(); save(); rerender(); }
  },
  'delete-skill': d => {
    const n = resOf(d.id).length;
    if (!confirm(`Supprimer cette compétence${n ? ` et ses ${n} ressource(s)` : ''} ? C’est définitif.`)) return;
    const c = skill(d.id).cat;
    db.customSkills = db.customSkills.filter(x => x.id !== d.id); delete db.mine[d.id];
    db.resources = db.resources.filter(r => r.skill !== d.id); db.sessions = db.sessions.filter(s => s.skill !== d.id);
    db.proofs.filter(p => p.skill === d.id).forEach(p => dropMedia(p.img)); db.proofs = db.proofs.filter(p => p.skill !== d.id);
    save(); closeSheet(); toast('Compétence supprimée'); go('#/cat/' + c);
  },
  'create-skill': d => {
    const input = $('#new-skill-name'), name = input.value.trim();
    if (!name) { toast('Donne un nom à la compétence'); input.focus(); return; }
    const exist = allSkills().find(s => s.name.toLowerCase() === name.toLowerCase());
    if (exist) { toast('Elle existe déjà, je t’y emmène'); go('#/skill/' + exist.id); return; }
    const s = {id:'c-' + (slug(name) || 'skill') + '-' + Math.random().toString(36).slice(2, 6), name, cat:d.cat, custom:true};
    db.customSkills.push(s); addSkill(s.id); save(); toast(`${name} créée et ajoutée à tes compétences`); go('#/skill/' + s.id);
  },
  'new-skill-from-search': () => {
    const name = (state.q || '').trim();
    openSheet(`<div style="padding:4px 12px 8px" class="col"><span class="title">Créer « ${esc(name)} »</span><span class="sub small">Dans quelle catégorie ?</span></div>
      <div style="max-height:55vh;overflow:auto">${cats().map(c => `<button class="opt" data-act="create-in" data-cat="${c.id}"><span style="width:12px;height:12px;border-radius:6px;background:${c.color}"></span>${esc(c.name)}</button>`).join('')}</div>`);
  },
  'create-in': d => {
    const name = (state.q || '').trim(); if (!name) return;
    const s = {id:'c-' + (slug(name) || 'skill') + '-' + Math.random().toString(36).slice(2, 6), name, cat:d.cat, custom:true};
    db.customSkills.push(s); addSkill(s.id); save(); closeSheet(); toast(`${name} créée`); go('#/skill/' + s.id);
  },

  /* Catégories */
  'nc-color': d => { state.color = d.v; rerender(); },
  'nc-scale': d => { state.scale = d.v; rerender(); },
  'nc-create': () => {
    const name = (state.name || '').trim(); if (!name) { toast('Donne un nom à la catégorie'); $('#nc-name').focus(); return; }
    const c = {id:'cat-' + (slug(name) || 'x') + '-' + Math.random().toString(36).slice(2, 5), name, color:state.color, scale:state.scale, custom:true};
    db.customCats.push(c); save(); toast('Catégorie créée. Ajoute-lui des compétences'); go('#/cat/' + c.id);
  },
  'del-cat': d => {
    const skills = db.customSkills.filter(s => s.cat === d.id), n = skills.reduce((a, s) => a + resOf(s.id).length, 0);
    if (!confirm(`Supprimer cette catégorie, ses ${skills.length} compétence(s) et ${n} ressource(s) ? C’est définitif.`)) return;
    const ids = new Set(skills.map(s => s.id));
    db.customCats = db.customCats.filter(c => c.id !== d.id); db.customSkills = db.customSkills.filter(s => !ids.has(s.id));
    ids.forEach(id => delete db.mine[id]); db.resources = db.resources.filter(r => !ids.has(r.skill)); db.sessions = db.sessions.filter(s => !ids.has(s.skill));
    db.proofs = db.proofs.filter(p => !ids.has(p.skill));
    save(); toast('Catégorie supprimée'); go('#/explore');
  },

  /* Filtres */
  'f-type': d => { state.type = d.v; rerender(); },
  'f-status': d => { state.status = d.v; rerender(); },

  /* Ressources */
  'f-set': d => { const f = state.form; f[d.k] = (d.toggle && f[d.k] === d.v) ? '' : d.v; rerender(); },
  'res-save': d => {
    const f = state.form, u = (f.url || '').trim();
    if (!f.title.trim()) { toast('Ajoute un titre'); $('#f-title').focus(); return; }
    if (!f.skill) { toast('Choisis la compétence concernée'); $('#f-skill').focus(); return; }
    if (u && !/^https?:\/\/\S+\.\S+/.test(u)) { toast('Le lien doit commencer par https://'); $('#f-url').focus(); return; }
    const data = {url:u, title:f.title.trim(), type:f.type, source:f.source.trim(), skill:f.skill, level:f.level, price:f.price, status:f.status, summary:(f.summary || '').trim(), duration:(f.duration || '').trim()};
    if (!mine(f.skill)) addSkill(f.skill);
    if (d.id) { Object.assign(res(d.id), data, {touchedAt:Date.now()}); save(); toast('Ressource mise à jour'); current = ''; location.hash = '#/res/' + d.id; }
    else {
      const r = Object.assign({id:uid('r'), createdAt:Date.now(), notes:(f.notes || '').trim(), rating:null, fav:false}, data);
      db.resources.push(r); mine(f.skill).touchedAt = Date.now(); save(); toast('Ressource ajoutée'); current = ''; location.hash = '#/res/' + r.id;
    }
  },
  'del-res': d => {
    if (!state.confirmDel) { state.confirmDel = true; rerender(); return; }
    const r = res(d.id); db.resources = db.resources.filter(x => x.id !== d.id);
    db.sessions.forEach(s => { if (s.res === d.id) s.res = ''; }); save(); toast('Ressource supprimée'); go('#/skill/' + r.skill);
  },
  'res-status': d => { const r = res(d.id); r.status = d.v; r.touchedAt = Date.now(); save(); toast(`Marquée « ${RES_STATUS[d.v]} »`); rerender(); },
  fav: d => { const r = res(d.id); r.fav = !r.fav; save(); toast(r.fav ? 'Ajoutée aux favoris' : 'Retirée des favoris'); rerender(); },

  /* Notation */
  'rate-tag': (d, el) => { state.tags.has(d.v) ? state.tags.delete(d.v) : state.tags.add(d.v); el.setAttribute('aria-pressed', state.tags.has(d.v)); },
  'rate-save': d => {
    const r = res(d.id);
    r.rating = {score:state.score, crit:state.crit ? state.crit.slice() : null, tags:[...state.tags], text:(state.text || '').trim(), at:Date.now()};
    if (r.status === 'todo') r.status = 'done';
    r.touchedAt = Date.now(); save(); toast(`Notée ${state.score}/100`); current = ''; location.hash = '#/res/' + d.id;
  },
  unrate: d => { res(d.id).rating = null; save(); toast('Note supprimée'); current = ''; location.hash = '#/res/' + d.id; },

  /* Sessions */
  'l-min': d => { state.form.minutes = +d.v; rerender(); },
  'log-save': () => {
    const f = state.form;
    if (!f.skill) { toast('Choisis une compétence'); $('#l-skill').focus(); return; }
    if (!(f.minutes > 0)) { toast('Indique une durée'); return; }
    db.sessions.push({id:uid('s'), skill:f.skill, minutes:f.minutes, date:f.date || todayKey(), res:f.res || '', note:(f.note || '').trim(), createdAt:Date.now()});
    if (!mine(f.skill)) addSkill(f.skill); mine(f.skill).touchedAt = Date.now();
    if (f.res && res(f.res) && res(f.res).status === 'todo') res(f.res).status = 'doing';
    save(); toast(`${fmtDur(f.minutes)} enregistrées. Série : ${streak()} jour${streak() > 1 ? 's' : ''}`); goBack('#/');
  },
  'del-session': d => { db.sessions = db.sessions.filter(s => s.id !== d.id); save(); toast('Session supprimée'); rerender(); },
  week: d => { state.week = Math.min(0, (state.week || 0) + +d.v); rerender(); },
  more: () => { state.more = true; rerender(); },

  /* Résumé IA */
  'ai-run': async () => {
    const f = state.form; if (!f || !f.url) return;
    const token = state; state.aiLoading = true; state.aiError = ''; rerender();
    try {
      const o = await aiSummarize(f.url, f.skill); if (state !== token) return;
      f.summary = o.summary; if (o.title && !f.title.trim()) f.title = o.title;
      if (o.type) f.type = o.type; if (o.level && !f.level) f.level = o.level; if (o.duration && !f.duration) f.duration = o.duration;
      toast('Résumé prêt');
    } catch (e) { if (state === token) state.aiError = 'L’IA n’a pas pu lire ce lien : ' + e.message; }
    if (state === token) { state.aiLoading = false; rerender(); }
  },
  'res-ai': async d => {
    const r = res(parse().params[0]); if (!r || !r.url) return;
    const token = state; state.aiLoading = true; state.aiError = ''; rerender();
    try { const o = await aiSummarize(r.url, r.skill); r.summary = o.summary; if (o.duration && !r.duration) r.duration = o.duration; save(); toast('Résumé prêt'); }
    catch (e) { if (state === token) state.aiError = 'L’IA n’a pas pu lire ce lien : ' + e.message; }
    if (state === token) { state.aiLoading = false; rerender(); }
  },
  'ai-test': async () => {
    state.aiTesting = true; rerender();
    try {
      const r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{'content-type':'application/json', 'x-api-key':db.settings.aiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:db.settings.aiModel || 'claude-haiku-5-5', max_tokens:10, messages:[{role:'user', content:'Réponds juste OK.'}]})});
      const j = await r.json().catch(() => ({}));
      toast(r.ok ? 'La clé fonctionne' : r.status === 401 ? 'Clé API invalide' : (j.error && j.error.message) || 'Erreur ' + r.status);
    } catch (e) { toast('Connexion impossible'); }
    state.aiTesting = false; rerender();
  },
  'ai-remove': () => { db.settings.aiKey = ''; save(); toast('Clé retirée'); rerender(); },

  /* Preuves */
  'pf-tpl': d => { const t = proofTemplates(state.form.skill)[+d.i]; Object.assign(state.form, {title:t.t, kind:t.k, unit:t.u || '', better:t.b || 'high'}); rerender(); },
  'pf-set': d => { state.form[d.k] = d.v; rerender(); },
  'pf-noimg': () => { const id = state.form.img; state.form.img = ''; const orig = db.proofs.find(p => p.img === id); if (!orig) dropMedia(id); rerender(); },
  'pf-save': d => {
    const f = state.form;
    if (!f.title.trim()) { toast('Donne un intitulé à ta preuve'); $('#pf-title').focus(); return; }
    if (f.url && !/^https?:\/\/\S+/.test(f.url.trim())) { toast('Le lien doit commencer par https://'); return; }
    if (!f.value.trim() && !f.url.trim() && !f.img && !f.note.trim()) { toast('Ajoute une valeur, un lien ou une photo'); return; }
    const data = {skill:f.skill, title:f.title.trim(), kind:f.kind, value:f.value.trim(), unit:f.unit.trim(), better:f.better, date:f.date || todayKey(), url:f.url.trim(), note:f.note.trim(), img:f.img || ''};
    if (d.id) { const p = db.proofs.find(x => x.id === d.id); if (p.img && p.img !== data.img) dropMedia(p.img); Object.assign(p, data); toast('Preuve mise à jour'); }
    else { db.proofs.push(Object.assign({id:uid('p'), createdAt:Date.now()}, data)); if (!mine(f.skill)) addSkill(f.skill); toast('Preuve ajoutée'); }
    save(); current = ''; location.hash = '#/skill/' + f.skill;
  },
  'pf-del': d => {
    if (!state.confirmDel) { state.confirmDel = true; rerender(); return; }
    const p = db.proofs.find(x => x.id === d.id); dropMedia(p.img); db.proofs = db.proofs.filter(x => x.id !== d.id); save(); toast('Preuve supprimée'); go('#/skill/' + p.skill);
  },

  /* Moodboard */
  'mood-quote': () => openSheet(`<div class="col" style="gap:12px;padding:4px 4px 8px">
    <span class="title">Nouvelle citation</span>
    <textarea id="q-text" rows="3" class="input" placeholder="Ex. : Le meilleur moment pour commencer, c’était il y a 10 ans. Le deuxième, c’est maintenant."></textarea>
    <input id="q-author" class="input" placeholder="Auteur (optionnel)">
    <div class="row wrap" style="gap:8px">${PALETTE.slice(0, 8).map((c, i) => `<button class="swatch" data-act="q-color" data-v="${c}" aria-pressed="${i === 0 ? 'true' : 'false'}" style="background:${c};width:32px;height:32px" aria-label="Couleur ${c}"></button>`).join('')}</div>
    <button class="btn primary" data-act="q-save">Ajouter au moodboard</button></div>`),
  'q-color': (d, el) => { $$('[data-act="q-color"]').forEach(b => b.setAttribute('aria-pressed', 'false')); el.setAttribute('aria-pressed', 'true'); },
  'q-save': () => {
    const text = ($('#q-text').value || '').trim(); if (!text) { toast('Écris ta citation'); return; }
    const sel = $('[data-act="q-color"][aria-pressed="true"]');
    db.mood.items.push({id:uid('i'), kind:'quote', text, author:($('#q-author').value || '').trim(), color:sel ? sel.dataset.v : PALETTE[db.mood.items.length % 8], createdAt:Date.now()});
    save(); closeSheet(); toast('Citation ajoutée'); rerender();
  },
  'mood-item': d => {
    const x = db.mood.items.find(i => i.id === d.id); if (!x) return;
    openSheet(`${x.kind === 'photo' ? `<button class="opt" data-act="mood-caption" data-id="${x.id}">${ic('edit', 22)}${x.caption ? 'Modifier la légende' : 'Ajouter une légende'}</button>` : ''}
      <button class="opt" data-act="mood-del" data-id="${x.id}" style="color:var(--bad)">${ic('trash', 22)}Retirer du moodboard</button>`);
  },
  'mood-caption': d => { const x = db.mood.items.find(i => i.id === d.id); closeSheet(); const v = prompt('Légende', x.caption || ''); if (v != null) { x.caption = v.trim(); save(); rerender(); } },
  'mood-del': d => { const x = db.mood.items.find(i => i.id === d.id); dropMedia(x.media); db.mood.items = db.mood.items.filter(i => i.id !== d.id); save(); closeSheet(); toast('Retiré'); rerender(); },
  'mood-music': () => openSheet(`<div class="col" style="gap:12px;padding:4px 4px 8px">
    <span class="title">Le son qui te motive</span>
    <input id="m-url" class="input" type="url" inputmode="url" placeholder="Lien Spotify, YouTube, Deezer, SoundCloud…" value="${esc(db.mood.music && db.mood.music.url || '')}">
    <button class="btn primary" data-act="m-save">Utiliser ce lien</button>
    <span class="sub small" style="text-align:center">ou</span>
    <label class="btn secondary" style="cursor:pointer">${ic('upload', 18, 2)}Choisir un fichier audio<input type="file" accept="audio/*" class="sr" data-file="music"></label>
    ${db.mood.music ? '<button class="danger-link" data-act="m-del" style="align-self:center">Retirer le son</button>' : ''}</div>`),
  'm-save': () => {
    const u = ($('#m-url').value || '').trim(); if (!/^https?:\/\//.test(u)) { toast('Colle un lien qui commence par https://'); return; }
    if (db.mood.music && db.mood.music.media) dropMedia(db.mood.music.media);
    db.mood.music = {kind:'link', url:u}; save(); closeSheet(); toast(embedFor(u) ? 'Son ajouté' : 'Lien ajouté (pas de lecteur intégré pour ce site)'); rerender();
  },
  'm-del': () => { if (db.mood.music && db.mood.music.media) dropMedia(db.mood.music.media); db.mood.music = null; save(); closeSheet(); rerender(); },

  /* Temps d'écran */
  'sc-add': () => {
    const app = ($('#sc-app').value || '').trim(), min = parseInt($('#sc-min').value, 10);
    if (!app) { toast('Indique le nom de l’app'); $('#sc-app').focus(); return; }
    if (!(min > 0)) { toast('Indique les minutes par jour'); $('#sc-min').focus(); return; }
    const wk = weekDays(state.week || 0)[0], exist = db.screen.find(x => x.week === wk && x.app.toLowerCase() === app.toLowerCase());
    if (exist) exist.perDay = min;
    else { const last = db.screen.filter(x => x.app.toLowerCase() === app.toLowerCase()).pop();
      db.screen.push({id:uid('t'), week:wk, app, perDay:min, verdict:last ? last.verdict : '', skill:last ? last.skill : ''}); }
    save(); rerender(); const a = $('#sc-app'); if (a) a.focus();
  },
  'sc-verdict': d => { const x = db.screen.find(y => y.id === d.id); x.verdict = x.verdict === d.v ? '' : d.v; save(); rerender(); },
  'sc-del': d => { db.screen = db.screen.filter(y => y.id !== d.id); save(); rerender(); },
  'sc-copy': () => {
    const off = state.week || 0, wk = weekDays(off)[0], prev = screenOf(weekDays(off - 1)[0]);
    prev.forEach(x => db.screen.push({id:uid('t'), week:wk, app:x.app, perDay:x.perDay, verdict:x.verdict, skill:x.skill}));
    save(); toast('Apps reprises : mets à jour les minutes'); rerender();
  },

  /* Réglages */
  's-goal': d => { db.settings.weeklyGoal = +d.v; save(); toast('Objectif mis à jour'); rerender(); },
  export: async () => {
    toast('Préparation de la sauvegarde…');
    const out = JSON.parse(JSON.stringify(db)); delete out.settings.aiKey; out.media = {};
    for (const id of mediaIds()) { try { const b = await idb.get(id); if (b) out.media[id] = await blobToDataURL(b); } catch (e) {} }
    const blob = new Blob([JSON.stringify(out)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `skillbase-sauvegarde-${todayKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('Sauvegarde téléchargée');
  },
  reset: () => {
    if (!state.confirmReset) { state.confirmReset = true; rerender(); return; }
    try { localStorage.removeItem(KEY); } catch (e) {}
    idb.clear().catch(() => {});
    db = null; state = {}; current = ''; location.hash = '#/'; rerender(); toast('Tout a été effacé');
  }
};

function importFile(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = normalize(JSON.parse(fr.result));
      if (!data || !data.profile) throw new Error('format');
      if (!confirm('Remplacer toutes tes données actuelles par cette sauvegarde ?')) return;
      const raw = JSON.parse(fr.result), media = raw.media || {}, key = db && db.settings.aiKey;
      Promise.all(Object.entries(media).map(([id, u]) => idb.put(id, dataURLToBlob(u)).catch(() => {}))).then(() => {
        data.onboarded = true; if (key && !data.settings.aiKey) data.settings.aiKey = key;
        db = data; save(); toast('Sauvegarde importée'); go('#/');
      });
    } catch (e) { toast('Ce fichier n’est pas une sauvegarde Skillbase valide'); }
  };
  fr.readAsText(file);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
window.addEventListener('hashchange', route);
route();

/* Appli installable : fonctionnement hors ligne + stockage protégé */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
